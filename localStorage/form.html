<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  </head>
  <body>
    <div class="container row d-flex">
      <div class="mt-5 col-6">
        <div class="mb-3">
          <label for="" class="form-label">NPM</label>
          <input type="text" name="npm" id="npm" class="form-control" placeholder="Masukan your npm" aria-describedby="helpId" />
        </div>
        <div class="mb-3">
          <label for="" class="form-label">Nama</label>
          <input type="text" name="nama" id="nama" class="form-control" placeholder="Masukan your nama" aria-describedby="helpId" />
        </div>
        <button onClick="save()" type="button" class="btn btn-primary">Button</button>
      </div>

      <div class="mt-5 col-6">
        <div class="table-responsive">
          <table class="table table-primary">
            <thead>
              <tr>
                <th scope="col">NPM</th>
                <th scope="col">Nama</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="form.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
